name: GameLingo repair 205
on:
  push:
    branches: [codex/subtitle-quality-repair]
    paths: ['repair-source/**', '.github/workflows/repair-verify.yml']
permissions:
  contents: read
concurrency:
  group: gamelingo-repair-205
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Verify engine order and overlay unchanged
        run: python3 repair-source/tests/verify_repair205.py
      - name: Regression tests and APK
        working-directory: repair-source
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Package source
        working-directory: repair-source
        run: zip -qr ../GameLingo-205-Kaynak.zip . -x '*/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-205-APK
          path: repair-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-205-Kaynak
          path: GameLingo-205-Kaynak.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GameLingo-205-Test
          path: repair-source/app/build/test-results/testDebugUnitTest
