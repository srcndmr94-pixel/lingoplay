name: GameLingo 203 Telefon APK

on:
  push:
    branches: [main]
    paths:
      - 'lingoplay-203-GameLingo-Kaynak.zip'
      - '.github/workflows/gamelin-203.yml'
  workflow_dispatch:

jobs:
  apk203:
    name: GameLingo 203 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 203 kaynak ZIP'i denetle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="lingoplay-203-GameLingo-Kaynak.zip"
          test -s "$ZIP" || { echo "::error::203 kaynak ZIP depoda bulunamadi"; exit 1; }
          unzip -tq "$ZIP" >/dev/null
          mkdir -p kaynak203
          unzip -q "$ZIP" -d kaynak203
          grep -Eq '^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*203[[:space:]]*$' kaynak203/app/build.gradle.kts || { echo "::error::203 surum dogrulamasi basarisiz"; exit 1; }
          grep -q 'versionName = "10.42.10-live-fixes"' kaynak203/app/build.gradle.kts || { echo "::error::Yanlis kaynak ZIP"; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android APK derle
        working-directory: kaynak203
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-203-Telefon-APK
          path: kaynak203/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
