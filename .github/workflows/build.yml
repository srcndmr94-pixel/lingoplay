name: GameLingo
on:
  push:
    branches: [main]
  workflow_dispatch:

# Üç iş birbirinden bağımsız: biri hata verse diğerleri yine çıktı üretir.

jobs:
  # ------------------------------------------------ telefon uygulaması (APK)
  telefon:
    name: Telefon APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Kaynagi ac
        shell: bash
        run: |
          set -e
          ZIP=$(git log --name-only --pretty=format: -n 50 \
                | grep -iE '\.zip$' | grep -iE 'lingoplay|altyazi' | head -n 1 || true)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          fi
          echo "Kaynak: $ZIP"
          rm -rf kaynak && mkdir kaynak
          unzip -q "$ZIP" -d kaynak
          ls kaynak

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Derle
        working-directory: kaynak
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: 1-Telefon-APK-${{ github.run_number }}
          path: kaynak/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # --------------------------------------------- Android TV uygulaması (APK)
  tv:
    name: TV APK
    runs-on: ubuntu-latest
    env:
      GAMELINGO_TV: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Kaynagi ac
        shell: bash
        run: |
          set -e
          ZIP=$(git log --name-only --pretty=format: -n 50 \
                | grep -iE '\.zip$' | grep -iE 'lingoplay|altyazi' | head -n 1 || true)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          fi
          echo "Kaynak: $ZIP"
          rm -rf kaynak && mkdir kaynak
          unzip -q "$ZIP" -d kaynak
          ls kaynak/tv

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Derle
        working-directory: kaynak
        run: gradle :tv:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: 2-TV-APK-${{ github.run_number }}
          path: kaynak/tv/build/outputs/apk/debug/tv-debug.apk
          if-no-files-found: error

  # --------------------------------------------------- bilgisayar uygulaması
  bilgisayar:
    name: Bilgisayar EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Kaynagi ac
        shell: bash
        run: |
          set -e
          ZIP=$(git log --name-only --pretty=format: -n 50 \
                | grep -iE '\.zip$' | grep -iE 'lingoplay|altyazi' | head -n 1 || true)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          fi
          echo "Kaynak: $ZIP"
          rm -rf kaynak && mkdir kaynak
          unzip -q "$ZIP" -d kaynak
          ls kaynak/pc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install pyinstaller mss numpy rapidocr-onnxruntime

      - name: Derle
        run: >
          pyinstaller --onefile --noconsole --name LingoPlay
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          kaynak/pc/lingoplay_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: 3-Bilgisayar-EXE-${{ github.run_number }}
          path: dist/LingoPlay.exe
          if-no-files-found: error
