<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 290px; font: 13px "Segoe UI", Roboto, Arial, sans-serif; background: #0b1a2b; color: #e6edf3; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #1d3550; }
  header img { width: 32px; height: 32px; }
  header b { font-size: 15px; } header b span { color: #3ddc84; }
  main { padding: 12px 14px; display: grid; gap: 12px; }
  label.satir { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #3ddc84; }
  input[type=range] { width: 100%; accent-color: #3ddc84; }
  #durum { padding: 8px 10px; border-radius: 6px; background: #12263d; color: #9fb3c8; min-height: 18px; }
  #durum.iyi, #pc.iyi { color: #3ddc84; } #durum.kotu, #pc.kotu { color: #ff7b72; }
  #pc { font-size: 12px; color: #7d8fa3; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #3ddc84; color: #0b1a2b; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  small { color: #7d8fa3; line-height: 1.4; }
</style>
</head>
<body>
<header><img src="simgeler/48.png" alt=""><b>Game<span>Lingo</span> Tarayıcı</b></header>
<main>
  <label class="satir">Çeviri açık <input type="checkbox" id="acik"></label>
  <label class="satir">İngilizce altyazıyı gizle <input type="checkbox" id="ingilizceGizle"></label>
  <div>
    <label class="satir" for="boyut">Yazı boyutu <span id="boyutDeger"></span></label>
    <input type="range" id="boyut" min="60" max="180" step="10">
  </div>
  <div id="durum">Durum bekleniyor...</div>
  <button id="hazirla">Türkçe çeviri modelini hazırla</button>
  <div id="pc">Oyun çevirisi (PC programı): bekleniyor...</div>
  <small>YouTube'da altyazıyı (CC) açın; Netflix ve Prime Video'da İngilizce altyazıyı seçin. Çeviri, İngilizce altyazının altında çıkar.</small>
</main>
<script src="acilir.js"></script>
</body>
</html>
